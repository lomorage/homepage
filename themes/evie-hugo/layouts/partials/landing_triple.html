<div class="features-section landing__section">
	<div class="container">
		<div class="features-section__header">
			<h2 class="features-section__title">{{ .Params.triple.title | markdownify }}</h2>
			<p class="features-section__subtitle">{{ .Params.triple.text| markdownify }}</p>
		</div>
		<div class="features-grid">
			{{ range .Params.triple.box }}
			<div class="feature-card">
				<div class="feature-card__media">
					<div class="feature-card__icon-bg">
						<img src="{{ .src }}" alt="{{ .alt }}" class="feature-card__image" />
					</div>
				</div>
				<h4 class="feature-card__title">{{ .title | markdownify }}</h4>
				<p class="feature-card__text">{{ .text | markdownify }}</p>
			</div>
			{{ end }}
		</div>
	</div>
</div>
