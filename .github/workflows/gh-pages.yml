name: github pages

on:
  push:
    branches:
      - master  # Set a branch to deploy
  pull_request:

jobs:
  # The Mac installer's release.json parser runs under osascript (JavaScript for Automation), which
  # only exists on macOS; `npm test` on Linux covers the same parser through Node and skips this one.
  mac-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mac-installer.test.mjs

  deploy:
    needs: mac-installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Build static website
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/master'
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: lomorage/lomorage.github.io
          publish_branch: master
          publish_dir: ./dist
          emptyCommits: false
          commitMessage: ${{ github.event.head_commit.message }}
